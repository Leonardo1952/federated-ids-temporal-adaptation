[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "distributed-drift-fl-ids"
version = "0.1.0"
description = "Leakage-controlled temporal evaluation of drift adaptation strategies in federated IIoT intrusion detection."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Leonardo Oliveira dos Santos" }]
requires-python = ">=3.11,<3.13"
classifiers = [
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: Microsoft :: Windows",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "matplotlib>=3.9,<4",
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "PyYAML>=6.0,<7",
  "scikit-learn>=1.5,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.1,<10",
  "ruff>=0.9,<1",
]

[project.scripts]
drift-campaign = "distributed_drift_ids.production.campaign_cli:main"
drift-analysis = "distributed_drift_ids.analysis.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
markers = [
  "internal_pilot: internal development-pilot route, outside the public interface (needs a Git checkout)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["distributed_drift_ids"]
